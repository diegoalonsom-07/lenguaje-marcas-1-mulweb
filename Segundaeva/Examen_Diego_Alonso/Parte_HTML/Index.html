<!DOCTYPE html>
<html lang="ES">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diego Alonso</title>
    <link rel="stylesheet" href="./Estilos/Style.css">
    <script src="./Scripts/funciones.js"></script>
</head>
<body>
    <h1>Lista de aprobados</h1>
    <form action="https://formsubmit.co/jlazaro@iescomercio.com" method="post">
        <fieldset>
            <legend>Datos personales</legend>
            <br>
            <div class="principal">
                <div class="izquierdo">
                    <label for="nombre">Nombre:</label><br><br>
                    <label for="Curso">Curso:</label><br><br>
                </div>
                <div class="derecho">
                    <input type="text" id="nombre" name="nombre" size="40" class="amarillo" placeholder="Nombre empresa" 
                        onfocus="borde_rojo(this.id)" onblur="borde_normal(this.id)"><br><br>
                    
                    <input type="text" id="direccion" name="direccion" size="50" class="amarillo" placeholder="Dirección particular" 
                        onfocus="borde_rojo(this.id)" onblur="borde_normal(this.id)"><br><br>
                </div>
            </div>
        </fieldset>
        
        <br><br>

        <fieldset>
            <legend>Notas</legend>
            <label for="nota">Elige tu nota</label>
            <br><br>
            <select name="nota" id="nota">
                <option value="Insuficiente">Insuficiente</option>
                <option value="Suficiente">Suficiente</option>
                <option value="Bien">Bien</option>
                <option value="Notable">Notable</option>
                <option value="Sobresaliente">Sobresaliente</option>
            </select>
        </fieldset>

        <br><br>

        <fieldset class="Profesor">
            <legend>Profesor</legend>

            <div id="listado_prof" onmouseover="oscurecer(this.id);" onmouseout="aclarar(this.id);">
                <label class="titulo">Elige tu profesor/a favorito:</label><br><br>
                
                <input type="radio" id="Yolanda" name="profesor" value="Yolanda">
                <label for="Yolanda">Yolanda</label><br>
                
                <input type="radio" id="Javier" name="profesor" value="Javier">
                <label for="Javier">Javier</label><br>

                <input type="radio" id="Justo" name="profesor" value="Justo">
                <label for="Justo">Justo</label><br>

                <input type="radio" id="Cesar" name="profesor" value="Cesar">
                <label for="Cesar">Cesar</label><br>

                <input type="radio" id="Andrea" name="profesor" value="Andrea">
                <label for="Andrea">Andrea</label><br>

                <input type="radio" id="Raquel" name="profesor" value="Raquel">
                <label for="Raquel">Raquel</label><br>

                <input type="radio" id="Juanma" name="profesor" value="Juanma">
                <label for="Juanma">Juanma</label><br>
            </div>
        </fieldset>
        <br>
        <div class="botones">
            <input type="submit" value="Confirmar" onclick="avisarEnvio();">
            <input type="reset" value="Anular" onclick="return confirmarBorrado();">
            <button onclick="mostrarFecha();">Mostrar fecha</button>
        </div>
    </form>
</body>
</html>
